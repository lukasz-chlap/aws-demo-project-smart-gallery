<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Gallery — S3 Events Demo</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,Arial;background:#090e1a;color:#edf2fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% 0,#162e4d 0,transparent 35%),#090e1a}
    main{max-width:1140px;margin:auto;padding:50px 26px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    h1{font-size:clamp(2.5rem,5vw,4.4rem);letter-spacing:-.06em;margin:8px 0}.subtitle{color:#a9bbd0;font-size:1.08rem;margin-bottom:28px}
    .kicker{color:#7dd8ff;letter-spacing:.15em;text-transform:uppercase;font-weight:700;font-size:.76rem}
    .upload{border:1px solid #344461;padding:24px;border-radius:18px;background:#101a2b;margin-bottom:32px}
    .upload h2{margin:0 0 14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    input{max-width:260px;background:#0a1220;border:1px solid #42536a;color:#fff;padding:12px;border-radius:10px}
    input[type=file]{max-width:320px}button{background:#8bdbff;color:#061724;padding:12px 18px;border:0;border-radius:10px;font-weight:800;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}#status{color:#afbdcd;font-size:.9rem;min-height:1.4rem}
    .heading{display:flex;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
    article{border:1px solid #31415b;background:#111b2c;border-radius:16px;overflow:hidden;transition:transform .15s}article:hover{transform:translateY(-3px)}
    article img{width:100%;height:175px;object-fit:cover;display:block;background:#263047}article .body{padding:16px}
    article p{margin:0;color:#e3ebf5;line-height:1.5;overflow-wrap:anywhere}small{display:block;color:#7e92ac;margin-top:12px}
    a{color:inherit;text-decoration:none}.empty{padding:35px;border:1px dashed #4b6181;border-radius:16px;color:#9fb1cb}
  </style>
</head>
<body><main>
  <header><div><div class="kicker">S3 • Lambda • Rekognition</div><h1>Smart Gallery<span style="color:#8bdbff">.</span></h1>
    <p class="subtitle">Upload a photo. Watch AWS automatically create a thumbnail and identify its content.</p></div>
    <button id="refresh">↻ Refresh gallery</button></header>
  <section class="upload"><h2>Upload a new image</h2><div class="controls">
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Choose an image" />
    <input id="token" type="password" placeholder="Demo upload passphrase" aria-label="Demo upload passphrase" />
    <button id="send">Upload to S3</button></div><p id="status" role="status">JPG, PNG or WebP, up to 8 MB.</p></section>
  <div class="heading"><h2>Image gallery</h2><span id="count"></span></div>
  <div id="gallery" class="grid"><div class="empty">Loading photos…</div></div>
</main>
<script src="config.js"></script>
<script>
const API = (window.GALLERY_API_URL || '').replace(/\/$/, '');
const gallery = document.getElementById('gallery');
const status = document.getElementById('status');
const send = document.getElementById('send');
async function load(){
  if(!API){gallery.textContent='Configuration missing: config.js';return;}
  try{
    const resp = await fetch(`${API}/images`, {cache:'no-store'});
    if(!resp.ok)throw new Error('Gallery API '+resp.status);
    const data=await resp.json(); gallery.replaceChildren();
    document.getElementById('count').textContent=`${data.items.length} images`;
    if(!data.items.length){const el=document.createElement('div');el.className='empty';el.textContent='No images yet. Upload one above!';gallery.append(el);}
    for(const item of data.items){
      const card=document.createElement('article'), anchor=document.createElement('a'), img=document.createElement('img');
      anchor.href=item.originalUrl;anchor.target='_blank';anchor.rel='noopener';
      img.src=item.thumbnailUrl;img.loading='lazy';img.alt=item.description;anchor.append(img);
      const body=document.createElement('div');body.className='body';
      const p=document.createElement('p');p.textContent=item.description;
      const small=document.createElement('small');small.textContent=new Date(item.createdAt).toLocaleString();
      body.append(p,small);card.append(anchor,body);gallery.append(card);
    }
  }catch(e){gallery.textContent='Could not load gallery: '+e.message;}
}
async function upload(){
  const file=document.getElementById('file').files[0];
  const token=document.getElementById('token').value;
  if(!file)return status.textContent='Choose an image first.';
  if(file.size>8*1024*1024)return status.textContent='Please select an image smaller than 8 MB.';
  if(!['image/jpeg','image/png','image/webp'].includes(file.type))return status.textContent='Unsupported image format.';
  send.disabled=true;status.textContent='Requesting upload URL…';
  try{
    const resp=await fetch(`${API}/upload-url`,{method:'POST',headers:{'content-type':'application/json','x-upload-token':token},body:JSON.stringify({contentType:file.type})});
    const details=await resp.json();if(!resp.ok)throw new Error(details.error||`API error: ${resp.status}`);
    status.textContent='Uploading directly to S3…';
    const put=await fetch(details.uploadUrl,{method:'PUT',headers:{'Content-Type':file.type},body:file});
    if(!put.ok)throw new Error('S3 rejected upload: '+put.status);
    status.textContent='Uploaded! Lambda is processing the image. Gallery refreshes automatically.';
    document.getElementById('file').value='';
    setTimeout(load,2000);setTimeout(load,5000);setTimeout(load,11000);
  }catch(e){status.textContent='Upload failed: '+e.message;}
  finally{send.disabled=false;}
}
document.getElementById('send').addEventListener('click',upload);
document.getElementById('refresh').addEventListener('click',load);
load();setInterval(load,15000);
</script></body></html>
